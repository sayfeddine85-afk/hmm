name: Build Android APK

on:
  push:
    branches:
      - claude/weight-tracking-app-gO7VO
    paths:
      - 'PoidsSuivi/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Forcer le runner sur Node 24 — les actions Node 20 sont dépréciées.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      # Plus de heap pour Gradle (RN 0.76 + Skia + new arch sont gourmands).
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false'

    defaults:
      run:
        working-directory: PoidsSuivi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PoidsSuivi/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Install npm dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: |
          echo "--- before prebuild ---"
          ls -la
          npx expo prebuild --platform android --no-install --clean
          echo "--- after prebuild ---"
          ls -la
          echo "--- android/ ---"
          ls -la android/ || { echo "ERREUR: pas de dossier android/ généré"; exit 1; }
          test -f android/gradlew || { echo "ERREUR: android/gradlew manquant"; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('PoidsSuivi/android/**/*.gradle*', 'PoidsSuivi/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK (signed with debug key for standalone install)
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace --info --warning-mode=summary 2>&1 | tee ../gradle-build.log

      - name: Locate APK
        id: apk
        if: always()
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1 || true)
          if [ -n "$APK" ]; then
            echo "Built: $APK ($(du -h "$APK" | cut -f1))"
          else
            echo "No APK found." >&2
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PoidsSuivi-release-apk
          path: PoidsSuivi/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Print last 200 lines of Gradle log on failure
        if: failure()
        run: |
          echo "=========== FIN DU LOG GRADLE ==========="
          tail -n 200 gradle-build.log 2>/dev/null || echo "(pas de log)"
          echo "=========== RECHERCHE D'ERREURS ==========="
          grep -nE "FAILED|error:|FAILURE:|What went wrong|Caused by:|> Task" gradle-build.log | tail -n 60 || true

      - name: Upload full Gradle log + reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            PoidsSuivi/gradle-build.log
            PoidsSuivi/android/app/build/reports/**
            PoidsSuivi/android/**/build/outputs/logs/**
          retention-days: 14
          if-no-files-found: ignore
